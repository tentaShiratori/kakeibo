name: 機能追加
description: 新しい動きや足したい仕事
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        用語は `CONTEXT.md`。ブランチは `{type}/{issue番号}-{slug}`（AGENTS.md）。
        番号は作成後にしか分からないので、作った直後に「ブランチ」を `feat/3-bun` の形へ直す。
  - type: textarea
    id: overview
    attributes:
      label: 概要
      description: 何をするか
    validations:
      required: true
  - type: dropdown
    id: branch_type
    attributes:
      label: ブランチの type
      options:
        - feat
        - fix
        - chore
    validations:
      required: true
  - type: input
    id: slug
    attributes:
      label: ブランチの slug
      description: 英小文字とハイフン。CONTEXT のローマ字をケバブにする
      placeholder: bun
    validations:
      required: true
  - type: input
    id: blocked_by
    attributes:
      label: Blocked by
      description: 先に終わる issue。無ければ空
      placeholder: "#3"
    validations:
      required: false
  - type: textarea
    id: spec
    attributes:
      label: 仕様
      description: docs や CONTEXT へのリンク。任意
      placeholder: "[docs/design.md](../docs/design.md)"
    validations:
      required: false
  - type: textarea
    id: todos
    attributes:
      label: やること
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 完了
      description: 満たせば終わり、と言える条件
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: やらないこと
      description: 今回は開かない範囲。任意
    validations:
      required: false
